<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Slider ...</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
  <div class="flex justify-center items-center min-h-screen bg-gray-100">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <h1 class="text-3xl font-bold text-green-600 text-center mb-8">
            Price Slider
        </h1>

        <div class="space-y-5">

            <div>
                <label for="min" class="block text-gray-700 font-medium mb-2">
                    Minimum Price
                </label>

                <input 
                    id="min"
                    type="number"
                    value="0"
                    name="min"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                />
            </div>

            <div>
                <label for="max" class="block text-gray-700 font-medium mb-2">
                    Maximum Price
                </label>

                <input
                    id="max"
                    type="number"
                    value="2500"
                    name="max"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                />
            </div>

        </div>

        <div class="mt-8 flex flex-col gap-4">

            <input
                id="slideMin"
                type="range"
                min="0"
                max="10000"
                value="0"
                class="w-full accent-green-500"
            />

            <input
                id="slideMax"
                type="range"
                min="0"
                max="10000"
                value="2500"
                class="w-full accent-green-500"
            />

        </div>

    </div>

</div>
    <script src="script.js"></script>
    </body>

   
</body>
</html>
